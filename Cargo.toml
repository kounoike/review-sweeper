[workspace]
members = [
    "apps/review-sweeper",
    "crates/application",
    "crates/architecture-tests",
    "crates/domain",
    "crates/execution",
    "crates/integrations",
    "crates/ui-gpui",
]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"
review-sweeper-application = { path = "crates/application" }
review-sweeper-domain = { path = "crates/domain" }
review-sweeper-execution = { path = "crates/execution" }
review-sweeper-integrations = { path = "crates/integrations" }
review-sweeper-ui-gpui = { path = "crates/ui-gpui" }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.dev]
debug = 1
